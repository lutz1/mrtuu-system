<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MRTUU System</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages with HashRouter
      // When GitHub Pages can't find a file, it serves this 404.html
      // Extract the path and convert to hash route for React Router
      
      // Get the current pathname (e.g., /mrtuu-system/dashboard/transactions)
      var pathname = location.pathname;
      var basePathname = '/mrtuu-system'; // Must match the repository name in package.json homepage
      
      // Extract the route part after the base pathname
      // e.g., /dashboard/transactions
      var route = pathname.substring(basePathname.length);
      
      // Store the route to be converted to hash later
      if (route && route !== '/' && route !== '') {
        sessionStorage.redirect = route;
      }
      
      // Redirect to index.html
      location.replace(basePathname + '/index.html');
    </script>
  </head>
  <body>
    <!-- Redirecting to MRTUU System... -->
  </body>
</html>
